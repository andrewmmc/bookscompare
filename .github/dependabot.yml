version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Expo SDK-managed packages must be upgraded together (including majors)
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'babel-preset-expo'
          - 'jest-expo'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - 'react-native'
          - '@react-native/*'
          - 'react-native-gesture-handler'
          - 'react-native-safe-area-context'
          - 'react-native-screens'
          - 'react-native-webview'
          - '@react-native-async-storage/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: bundler
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns:
          - '*'
      bundler-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
